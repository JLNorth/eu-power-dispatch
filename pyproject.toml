[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eu-power-dispatch"
version = "0.1.0"
description = "LP/MIP optimisation models of European power markets: battery arbitrage and merit-order unit commitment."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Jamie North" }]
requires-python = ">=3.11"
dependencies = [
    "pyomo>=6.7",
    "highspy>=1.7",
    "pandas>=2.1",
    "numpy>=1.26",
    "pyarrow>=14",
    "matplotlib>=3.8",
    "pyyaml>=6.0",
    "entsoe-py>=0.6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
gurobi = ["gurobipy"]

[project.scripts]
epd-battery = "eu_power_dispatch.run_battery:main"
epd-market = "eu_power_dispatch.run_market:main"
epd-validate = "eu_power_dispatch.validate:main"
epd-scenario = "eu_power_dispatch.scenarios:main"
epd-fetch = "eu_power_dispatch.data.entsoe_loader:main"
epd-prepare = "eu_power_dispatch.data.prepare:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
